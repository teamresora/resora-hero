<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resora Office Table</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#f5f5f5;color:#1a1a2e;font-family:'IBM Plex Mono',ui-monospace,monospace}
.track{height:500vh;position:relative}
.sticky{position:sticky;top:0;height:100vh;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%}
.dots{position:absolute;right:max(24px,4vw);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.dots span{width:8px;height:8px;border-radius:9999px;background:rgba(26,26,46,.2);transition:background .3s,transform .3s}
.dots span.on{background:#ff5a5f;transform:scale(1.4)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="data-teal.js"></script>
<script src="data-red.js"></script>
<script src="data-yellow.js"></script>
<script src="data-navy.js"></script>
<script src="data-white.js"></script>
</head>
<body>
<div class="track" id="track">
  <div class="sticky">
    <div id="stage"></div>
    <div class="dots" id="dots"></div>
  </div>
</div>
<script>
(function(){
  /* hex: monitor screen and rim trim, css: hologram frame, kick: hologram label colour */
  var SECTIONS=[
    {model:'MB_TEAL',  hex:0x00c2ba, css:'0,194,186',   kick:'0,194,186',   kickName:'The problem',  head:'Your Filipino team member may be an employee.', body:'If they work set hours and follow your direction, courts may treat them as your employee.'},
    {model:'MB_RED',   hex:0xff5a5f, css:'255,90,95',   kick:'255,90,95',   kickName:'How it works', head:'Resora employs them for you.', body:'We recruit, employ, pay and manage. You lead the work, and we carry the employer load.'},
    {model:'MB_YELLOW',hex:0xffd60a, css:'255,214,10',  kick:'255,214,10',  kickName:'The talent',   head:'Business-ready English. AEST hours.', body:'Strong AI-tool skills, 40+ years of Australian business experience behind the team.'},
    {model:'MB_NAVY',  hex:0x1a1a2e, css:'244,247,251', kick:'244,247,251', kickName:'Pricing',      head:'No salary markup. No setup fee.', body:'Recruitment from $4,750, then management from $200 a month per team member.'},
    {model:'MB_WHITE', hex:0xffffff, css:'244,247,251', kick:'255,90,95',   kickName:'Compliance',   head:'Fully compliant with Australian law.', body:'Fair Work protected. Payroll, super and leave handled for you, every pay run.'}
  ];
  var N=SECTIONS.length, RT=1.5, RM=2.8, RC=2.35, RMO=0.95, H=1.4;
  var track=document.getElementById('track');
  var stage=document.getElementById('stage');
  var dotsEl=document.getElementById('dots');
  SECTIONS.forEach(function(){ dotsEl.appendChild(document.createElement('span')); });
  var dots=[].slice.call(dotsEl.children);

  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true;
  renderer.setClearColor(0x000000,0);
  stage.appendChild(renderer.domElement);

  var scene=new THREE.Scene();
  var cam=new THREE.PerspectiveCamera(30,1,0.1,100);
  scene.add(new THREE.HemisphereLight(0xffffff,0xd9d4cc,0.9));
  var key=new THREE.DirectionalLight(0xfff4e6,1.6); key.position.set(-4,9,6); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048); key.shadow.camera.left=-6; key.shadow.camera.right=6; key.shadow.camera.top=6; key.shadow.camera.bottom=-6;
  scene.add(key);
  var fill=new THREE.DirectionalLight(0xffffff,0.5); fill.position.set(5,4,5); scene.add(fill);

  function mat(c,extra){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.6,metalness:0.1},extra||{}));}

  /* office floor: a soft warm grey that takes the shadows */
  var floor=new THREE.Mesh(new THREE.CircleGeometry(7,96),mat(0xe9e6e1,{roughness:0.95}));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

  /* the round table: white top, navy base */
  var table=new THREE.Group(); scene.add(table);
  var top=new THREE.Mesh(new THREE.CylinderGeometry(RT,RT,0.08,96),mat(0xffffff,{roughness:0.4}));
  top.position.y=0.75; top.castShadow=true; top.receiveShadow=true; table.add(top);
  var trim=new THREE.Mesh(new THREE.TorusGeometry(RT,0.025,12,128),mat(0x1a1a2e,{roughness:0.5}));
  trim.rotation.x=Math.PI/2; trim.position.y=0.79; table.add(trim);
  var pedestal=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.3,0.72,48),mat(0x1a1a2e,{roughness:0.5}));
  pedestal.position.y=0.36; pedestal.castShadow=true; table.add(pedestal);

  /* hologram: the presenter's text, floating above the front monitor */
  var holoCanvas=document.createElement('canvas'); holoCanvas.width=1024; holoCanvas.height=576;
  var hctx=holoCanvas.getContext('2d');
  var holoTex=new THREE.CanvasTexture(holoCanvas);
  var holo=new THREE.Mesh(new THREE.PlaneGeometry(3.2,1.8),new THREE.MeshBasicMaterial({map:holoTex,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide}));
  holo.position.set(0,2.75,1.0); scene.add(holo);
  var active=-1, holoOpacity=0;
  function drawHolo(s){
    var ctx=hctx, W=holoCanvas.width, Hh=holoCanvas.height;
    ctx.clearRect(0,0,W,Hh);
    ctx.fillStyle='rgba(26,26,46,0.94)'; ctx.fillRect(0,0,W,Hh);
    ctx.strokeStyle='rgba('+s.css+',0.9)'; ctx.lineWidth=6; ctx.strokeRect(8,8,W-16,Hh-16);
    ctx.fillStyle='rgb('+s.kick+')'; ctx.font='500 30px "IBM Plex Mono", monospace';
    ctx.fillText(s.kickName.toUpperCase(),60,110);
    ctx.fillStyle='#ffffff'; ctx.font='800 64px "Unbounded", sans-serif';
    wrap(s.head,60,190,W-120,74);
    ctx.fillStyle='rgba(255,255,255,0.78)'; ctx.font='400 32px "IBM Plex Mono", monospace';
    wrap(s.body,60,400,W-120,44);
    holoTex.needsUpdate=true;
  }
  function wrap(text,x,y,maxW,lh){
    var words=text.split(' '), line='';
    for(var i=0;i<words.length;i++){
      var test=line+words[i]+' ';
      if(hctx.measureText(test).width>maxW && line){ hctx.fillText(line,x,y); line=words[i]+' '; y+=lh; }
      else { line=test; }
    }
    hctx.fillText(line,x,y);
  }

  /* each station: a monitor on the table, a chair, and a mascot standing behind the chair */
  var stations=[];
  SECTIONS.forEach(function(s,i){
    var theta=i*Math.PI*2/N;
    var sin=Math.sin(theta), cos=Math.cos(theta);
    var st={theta:theta,mascot:new THREE.Group(),lean:null,chair:null,monitor:new THREE.Group(),screenMat:null,mascotR:RM,chairR:RC,leanAmt:0};

    /* monitor on the table, screen facing its own seat */
    st.monitor.position.set(RMO*sin,0.79,RMO*cos);
    st.monitor.rotation.y=theta+Math.PI;
    var body=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.42,0.04),mat(0x1a1a2e,{roughness:0.5}));
    body.position.set(0,0.42,0); body.castShadow=true; st.monitor.add(body);
    st.screenMat=new THREE.MeshBasicMaterial({color:s.hex});
    var screen=new THREE.Mesh(new THREE.PlaneGeometry(0.56,0.34),st.screenMat);
    screen.position.set(0,0.42,0.03); st.monitor.add(screen);
    var stand=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.2,0.04),mat(0x1a1a2e));
    stand.position.set(0,0.1,0); st.monitor.add(stand);
    table.add(st.monitor);

    /* chair in front of the mascot, between the table and the mascot */
    var chair=new THREE.Group(); chair.position.set(RC*sin,0,RC*cos); chair.rotation.y=theta+Math.PI; table.add(chair); st.chair=chair;
    var seat=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,0.07,40),mat(0x2d2d2d,{roughness:0.7}));
    seat.position.y=0.5; seat.castShadow=true; chair.add(seat);
    var back=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.5,0.06),mat(0x2d2d2d,{roughness:0.7}));
    back.position.set(0,0.82,-0.24); back.castShadow=true; chair.add(back);
    var leg=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.48,12),mat(0x888888,{metalness:0.6}));
    leg.position.y=0.26; chair.add(leg);

    /* the mascot stands behind the chair, facing the table */
    st.mascot.position.set(RM*sin,0,RM*cos);
    st.mascot.rotation.y=theta+Math.PI;
    table.add(st.mascot);
    /* the lean group tips the whole mascot sideways when it presents */
    st.lean=new THREE.Group(); st.mascot.add(st.lean);
    var bin=null; try{bin=atob(window[s.model]);}catch(e){bin=null;}
    if(bin){
      var buf=new Uint8Array(bin.length);
      for(var k=0;k<bin.length;k++){buf[k]=bin.charCodeAt(k);}
      new THREE.GLTFLoader().parse(buf.buffer,'',function(gltf){
        var m=gltf.scene;
        m.rotation.y=-Math.PI/2;
        m.updateMatrixWorld(true);
        var box=new THREE.Box3().setFromObject(m);
        m.scale.setScalar(H/box.getSize(new THREE.Vector3()).y);
        m.updateMatrixWorld(true);
        box=new THREE.Box3().setFromObject(m);
        var cen=box.getCenter(new THREE.Vector3());
        m.position.set(-cen.x,-box.min.y,-cen.z);
        m.traverse(function(o){ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
        st.lean.add(m);
      },function(){});
    }
    stations.push(st);
  });

  /* layout */
  function layout(){
    var w=innerWidth,h=innerHeight;
    renderer.setSize(w,h,false);
    cam.aspect=w/h;
    if(w<700){ cam.fov=46; cam.position.set(0,3.8,12); cam.lookAt(0,1.2,0); }
    else { cam.fov=30; cam.position.set(0,3.4,11); cam.lookAt(0,1.2,0); }
    cam.updateProjectionMatrix();
  }
  layout();
  addEventListener('resize',layout);

  function progress(){
    var r=track.getBoundingClientRect();
    var total=track.offsetHeight-innerHeight;
    return Math.min(1,Math.max(0,-r.top/total));
  }

  var rot=0;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function turn(current,goal,speed){
    var d=goal-current;
    d=Math.atan2(Math.sin(d),Math.cos(d));
    return current+d*speed;
  }
  function frame(now){
    var p=progress();
    var idx=Math.min(N-1,Math.floor(p*N));
    /* the table turns so the presenter's seat is at the front */
    rot=turn(rot,-stations[idx].theta,0.06);
    table.rotation.y=rot;

    if(idx!==active){
      active=idx;
      drawHolo(SECTIONS[idx]);
      dots.forEach(function(d,i){ d.classList.toggle('on',i===idx); });
    }
    holoOpacity+=(1-holoOpacity)*0.08;
    holo.material.opacity=holoOpacity*0.95;

    stations.forEach(function(st,i){
      var presenting=(i===idx);
      /* the presenter's mascot turns to the camera and its monitor faces out */
      var mascotGoal=presenting?st.theta:st.theta+Math.PI;
      st.mascot.rotation.y=turn(st.mascot.rotation.y,mascotGoal,0.08);
      /* the presenter moves from its chair onto the table edge, the chair slides away to make room */
      st.mascotR+=((presenting?RT+0.05:RM)-st.mascotR)*0.06;
      st.chairR+=((presenting?RC+0.9:RC)-st.chairR)*0.06;
      st.mascot.position.set(st.mascotR*Math.sin(st.theta),0,st.mascotR*Math.cos(st.theta));
      st.chair.position.set(st.chairR*Math.sin(st.theta),0,st.chairR*Math.cos(st.theta));
      st.leanAmt+=((presenting?0.3:0)-st.leanAmt)*0.08;
      st.lean.rotation.z=st.leanAmt;
      var monitorGoal=presenting?st.theta:st.theta+Math.PI;
      st.monitor.rotation.y=turn(st.monitor.rotation.y,monitorGoal,0.08);
      st.screenMat.opacity=1;
    });

    renderer.render(scene,cam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
