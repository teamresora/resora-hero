<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resora Office Table</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#050d1f;color:#f4f7fb;font-family:'IBM Plex Mono',ui-monospace,monospace}
.track{height:500vh;position:relative}
.sticky{position:sticky;top:0;height:100vh;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(3,8,20,.85) 100%)}
.dots{position:absolute;right:max(24px,4vw);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.dots span{width:8px;height:8px;border-radius:9999px;background:rgba(0,194,186,.25);transition:background .3s,transform .3s}
.dots span.on{background:#ff5a5f;transform:scale(1.4)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="data-globe.js"></script>
<script src="data-teal.js"></script>
<script src="data-red.js"></script>
<script src="data-yellow.js"></script>
<script src="data-navy.js"></script>
<script src="data-white.js"></script>
</head>
<body>
<div class="track" id="track">
  <div class="sticky">
    <div id="stage"></div>
    <div class="vig"></div>
    <div class="dots" id="dots"></div>
  </div>
</div>
<script>
(function(){
  /* the monitor model, generated in Higgsfield, reused at all five seats */
  var MONITOR_URL='https://cdn.prod.website-files.com/6a435801d0e328b4fc80f68e/6adb1fea1f4c4205b728c2cc_monitor.glb';
  /* the five presenters, in order. accent: rim and hologram colour. seat: chair colour from the palette. */
  var SECTIONS=[
    {url:'https://cdn.prod.website-files.com/6a435801d0e328b4fc80f68e/6adb1f07f0207743894bfa7f_seated-teal.glb', accent:0x00c2ba, seat:0x00c2ba, css:'0,194,186',   kickName:'The problem',  head:'Your Filipino team member may be an employee.', body:'If they work set hours and follow your direction, courts may treat them as your employee.'},
    {url:'https://cdn.prod.website-files.com/6a435801d0e328b4fc80f68e/6adb1fea1f4c4205b728c268_seated-red.glb', accent:0xff5a5f, seat:0xff5a5f, css:'255,90,95',   kickName:'How it works', head:'Resora employs them for you.', body:'We recruit, employ, pay and manage. You lead the work, and we carry the employer load.'},
    {url:'https://cdn.prod.website-files.com/6a435801d0e328b4fc80f68e/6adb1fea1f4c4205b728c28f_seated-yellow.glb', accent:0xffd60a, seat:0xffd60a, css:'255,214,10',  kickName:'The talent',   head:'Business-ready English. AEST hours.', body:'Strong AI-tool skills, 40+ years of Australian business experience behind the team.'},
    {url:'https://cdn.prod.website-files.com/6a435801d0e328b4fc80f68e/6adb1fea31b8b5ca7da1d27d_seated-navy.glb', accent:0x6f7fb8, seat:0x2d2d4e, css:'111,127,184', kickName:'Pricing',      head:'No salary markup. No setup fee.', body:'Recruitment from $4,750, then management from $200 a month per team member.'},
    {url:'https://cdn.prod.website-files.com/6a435801d0e328b4fc80f68e/6adb1fea83200027881ea612_seated-white.glb', accent:0xf6f1ea, seat:0xf6f1ea, css:'246,241,234', kickName:'Compliance',   head:'Fully compliant with Australian law.', body:'Fair Work protected. Payroll, super and leave handled for you, every pay run.'}
  ];
  var N=SECTIONS.length, RT=1.5, RM=1.75, RC=2.35, RMO=1.15, H=1.4;
  var track=document.getElementById('track');
  var stage=document.getElementById('stage');
  var dotsEl=document.getElementById('dots');
  SECTIONS.forEach(function(){ dotsEl.appendChild(document.createElement('span')); });
  var dots=[].slice.call(dotsEl.children);

  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true;
  renderer.setClearColor(0x050d1f,1);
  stage.appendChild(renderer.domElement);

  var scene=new THREE.Scene();
  var cam=new THREE.PerspectiveCamera(30,1,0.1,100);
  scene.add(new THREE.HemisphereLight(0x9fb8e8,0x0a1428,1.1));
  var key=new THREE.SpotLight(0xffe2b0,3.2,22,Math.PI/5,0.8,1.4);
  key.position.set(-3,9,6); key.target.position.set(0,0.6,0); key.castShadow=true;
  scene.add(key); scene.add(key.target);
  var rim=new THREE.DirectionalLight(0x4fe6dd,1.2); rim.position.set(4,3,-4); scene.add(rim);

  function mat(c,extra){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.45,metalness:0.35},extra||{}));}

  /* the hero's globe, dimmed and set back so it sits behind the office like the hero's background */
  var globe=new THREE.Group(); globe.position.set(0,3.4,-8); scene.add(globe);
  var bin0=null; try{bin0=atob(window.MB_GLOBE);}catch(e){bin0=null;}
  if(bin0){
    var gbuf=new Uint8Array(bin0.length);
    for(var g=0;g<bin0.length;g++){gbuf[g]=bin0.charCodeAt(g);}
    new THREE.GLTFLoader().parse(gbuf.buffer,'',function(gltf){
      var gm=gltf.scene;
      gm.traverse(function(o){ if(o.isMesh&&o.material){ o.material.transparent=true; o.material.opacity=0.42; o.material.depthWrite=false; } });
      gm.updateMatrixWorld(true);
      var gb=new THREE.Box3().setFromObject(gm);
      gm.scale.setScalar(7/gb.getSize(new THREE.Vector3()).y);
      gm.updateMatrixWorld(true);
      gb=new THREE.Box3().setFromObject(gm);
      var gc=gb.getCenter(new THREE.Vector3());
      gm.position.set(-gc.x,-gc.y,-gc.z);
      globe.add(gm);
    },function(){});
  }

  /* a dark floor disc with a faint white ring, no bright surfaces */
  var floor=new THREE.Mesh(new THREE.CircleGeometry(6.5,96),mat(0x0a1630,{roughness:0.9,metalness:0.1}));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
  var ring=new THREE.Mesh(new THREE.RingGeometry(5.6,5.63,160),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.12}));
  ring.rotation.x=-Math.PI/2; ring.position.y=0.003; scene.add(ring);

  /* the round table: dark navy top, a navy pedestal, and a rim in the presenter's accent colour */
  var table=new THREE.Group(); table.scale.setScalar(1.15); scene.add(table);
  var top=new THREE.Mesh(new THREE.CylinderGeometry(RT,RT,0.08,96),mat(0x1a1a2e,{roughness:0.35,metalness:0.5}));
  top.position.y=0.75; top.castShadow=true; top.receiveShadow=true; table.add(top);
  var trimMat=mat(0x00c2ba,{emissive:0x00c2ba,emissiveIntensity:0.5});
  var trim=new THREE.Mesh(new THREE.TorusGeometry(RT,0.025,12,128),trimMat);
  trim.rotation.x=Math.PI/2; trim.position.y=0.79; table.add(trim);
  var pedestal=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.3,0.72,48),mat(0x1a1a2e,{roughness:0.4,metalness:0.6}));
  pedestal.position.y=0.36; pedestal.castShadow=true; table.add(pedestal);

  /* hologram: the hero's translucent teal glass panel */
  var holoCanvas=document.createElement('canvas'); holoCanvas.width=1024; holoCanvas.height=576;
  var hctx=holoCanvas.getContext('2d');
  var holoTex=new THREE.CanvasTexture(holoCanvas);
  var holo=new THREE.Mesh(new THREE.PlaneGeometry(3.2,1.8),new THREE.MeshBasicMaterial({map:holoTex,transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide}));
  holo.position.set(0,2.75,1.0); scene.add(holo);
  /* a beam from the presenter's monitor up to the hologram, like the hero's beam */
  var beamGeo=new THREE.BufferGeometry();
  beamGeo.setAttribute('position',new THREE.Float32BufferAttribute([-0.2,1.3,1.4, 0.2,1.3,1.4, 1.6,1.85,1.0, -1.6,1.85,1.0],3));
  beamGeo.setIndex([0,1,2, 0,2,3]);
  var beamMat=new THREE.MeshBasicMaterial({color:0x00c2ba,transparent:true,opacity:0.22,depthWrite:false,side:THREE.DoubleSide});
  scene.add(new THREE.Mesh(beamGeo,beamMat));
  var active=-1, holoOpacity=0;
  function drawHolo(s){
    var ctx=hctx, W=holoCanvas.width, Hh=holoCanvas.height;
    ctx.clearRect(0,0,W,Hh);
    var gr=ctx.createLinearGradient(0,0,0,Hh);
    gr.addColorStop(0,'rgba(0,194,186,0.14)'); gr.addColorStop(1,'rgba(8,28,50,0.42)');
    ctx.fillStyle=gr; ctx.fillRect(0,0,W,Hh);
    ctx.fillStyle='rgba(255,255,255,0.035)';
    for(var y=0;y<Hh;y+=4){ ctx.fillRect(0,y,W,1); }
    ctx.shadowColor='rgba(0,194,186,0.45)'; ctx.shadowBlur=30;
    ctx.strokeStyle='rgba(0,194,186,0.6)'; ctx.lineWidth=4; ctx.strokeRect(10,10,W-20,Hh-20);
    ctx.shadowBlur=0;
    ctx.fillStyle='#00c2ba'; ctx.font='500 30px "IBM Plex Mono", monospace';
    ctx.fillText(s.kickName.toUpperCase(),60,110);
    ctx.fillStyle='#f4f7fb'; ctx.font='800 64px "Unbounded", sans-serif';
    wrap(s.head,60,190,W-120,74);
    ctx.fillStyle='#9fb3d1'; ctx.font='400 32px "IBM Plex Mono", monospace';
    wrap(s.body,60,400,W-120,44);
    holoTex.needsUpdate=true;
  }
  function wrap(text,x,y,maxW,lh){
    var words=text.split(' '), line='';
    for(var i=0;i<words.length;i++){
      var test=line+words[i]+' ';
      if(hctx.measureText(test).width>maxW && line){ hctx.fillText(line,x,y); line=words[i]+' '; y+=lh; }
      else { line=test; }
    }
    hctx.fillText(line,x,y);
  }

  /* each station: a monitor on the table, a chair in the palette, and a mascot */
  var stations=[];
  SECTIONS.forEach(function(s,i){
    var theta=i*Math.PI*2/N;
    var sin=Math.sin(theta), cos=Math.cos(theta);
    var st={theta:theta,mascot:new THREE.Group(),lean:null,chair:null,monitor:new THREE.Group(),mascotR:RM,leanAmt:0};

    /* the monitor model, scaled to a desk monitor */
    st.monitor.position.set(RMO*sin,0.79,RMO*cos);
    st.monitor.rotation.y=theta+Math.PI;
    new THREE.GLTFLoader().load(MONITOR_URL,function(gltf){
      var mm=gltf.scene;
      mm.traverse(function(o){ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
      var bb=new THREE.Box3().setFromObject(mm);
      mm.scale.setScalar(0.5/bb.getSize(new THREE.Vector3()).y);
      mm.updateMatrixWorld(true);
      bb=new THREE.Box3().setFromObject(mm);
      var c=bb.getCenter(new THREE.Vector3());
      mm.position.set(-c.x,-bb.min.y,-c.z);
      st.monitor.add(mm);
      /* the generated monitor is a single mesh, so the whole device takes a dark navy body with this presenter's accent glow */
      mm.traverse(function(o){
        if(!o.isMesh) return;
        o.material=o.material.clone();
        o.material.color.setHex(0x1a1a2e);
        o.material.emissive.setHex(s.accent);
        o.material.emissiveIntensity=0.35;
        st.screen=o;
      });
    });
    table.add(st.monitor);

    /* chair in the palette, between the table and the mascot */
    var chair=new THREE.Group(); chair.position.set(RC*sin,0,RC*cos); chair.rotation.y=theta+Math.PI; table.add(chair); st.chair=chair;
    var seat=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,0.07,40),mat(s.seat,{roughness:0.5}));
    seat.position.y=0.5; seat.castShadow=true; chair.add(seat);
    var back=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.5,0.06),mat(s.seat,{roughness:0.5}));
    back.position.set(0,0.82,-0.24); back.castShadow=true; chair.add(back);
    var leg=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.48,12),mat(0x888888,{metalness:0.6}));
    leg.position.y=0.26; chair.add(leg);

    /* the mascot: st.mascot is positioned and turned, st.lean tips it back when presenting */
    st.mascot.position.set(RM*sin,0,RM*cos);
    st.mascot.rotation.y=theta+Math.PI;
    table.add(st.mascot);
    st.lean=new THREE.Group(); st.mascot.add(st.lean);
    /* the seated mascot model from Higgsfield, chair included */
    new THREE.GLTFLoader().load(s.url,function(gltf){
      var m=gltf.scene;
      m.rotation.y=-Math.PI/2;
      m.updateMatrixWorld(true);
      var bb=new THREE.Box3().setFromObject(m);
      m.scale.setScalar(H/bb.getSize(new THREE.Vector3()).y);
      m.updateMatrixWorld(true);
      bb=new THREE.Box3().setFromObject(m);
      var cen=bb.getCenter(new THREE.Vector3());
      m.position.set(-cen.x,-bb.min.y,-cen.z);
      m.traverse(function(o){ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
      st.lean.add(m);
    },function(){},function(){});
    stations.push(st);
  });

  /* layout */
  function layout(){
    var w=innerWidth,h=innerHeight;
    renderer.setSize(w,h,false);
    cam.aspect=w/h;
    if(w<700){ cam.fov=46; cam.position.set(0,3.8,12); cam.lookAt(0,1.4,0); }
    else { cam.fov=30; cam.position.set(0,3.2,11); cam.lookAt(0,1.5,0); }
    cam.updateProjectionMatrix();
  }
  layout();
  addEventListener('resize',layout);

  function progress(){
    var r=track.getBoundingClientRect();
    var total=track.offsetHeight-innerHeight;
    return Math.min(1,Math.max(0,-r.top/total));
  }
  /* the section copy is edited in Webflow and sent here by message, so the text stays editable */
  var RZ_ORIGINS=['https://resora.com.au','https://www.resora.com.au','https://resora.ph','https://www.resora.ph','https://resora-ad05e1.design.webflow.com'];
  addEventListener('message',function(e){
    if(RZ_ORIGINS.indexOf(e.origin)<0 || !e.data || !e.data.rzCopy) return;
    e.data.rzCopy.forEach(function(c,i){
      if(!SECTIONS[i]) return;
      if(c.kick) SECTIONS[i].kickName=c.kick;
      if(c.head) SECTIONS[i].head=c.head;
      if(c.body) SECTIONS[i].body=c.body;
    });
    active=-1;
  });
  var rot=0;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function turn(current,goal,speed){
    var d=goal-current;
    d=Math.atan2(Math.sin(d),Math.cos(d));
    return current+d*speed;
  }
  function frame(now){
    var t=reduce?0:now/1000;
    var p=progress();
    var idx=Math.min(N-1,Math.floor(p*N));
    /* the table turns so the presenter's seat is at the front */
    rot=turn(rot,-stations[idx].theta,0.06);
    table.rotation.y=rot;
    /* the presenter's rim takes its accent colour */
    trimMat.color.setHex(SECTIONS[idx].accent);
    trimMat.emissive.setHex(SECTIONS[idx].accent);
    beamMat.color.setHex(SECTIONS[idx].accent);
    globe.rotation.y=reduce?0:t*0.03;

    if(idx!==active){
      active=idx;
      drawHolo(SECTIONS[idx]);
      dots.forEach(function(d,i){ d.classList.toggle('on',i===idx); });
    }
    holoOpacity+=(1-holoOpacity)*0.08;
    holo.material.opacity=holoOpacity*0.95;
    holo.position.y=2.75+(reduce?0:Math.sin(t*1.2)*0.04);

    stations.forEach(function(st,i){
      var presenting=(i===idx);
      /* the presenter turns to the camera; the others face their screens */
      var goal=presenting?st.theta:st.theta+Math.PI;
      st.mascot.rotation.y=turn(st.mascot.rotation.y,goal,0.08);
      st.monitor.rotation.y=turn(st.monitor.rotation.y,goal,0.08);
      /* the presenter moves onto the table edge; the chair is hidden while they stand */
      st.mascotR=RM;
      st.mascot.position.set(st.mascotR*Math.sin(st.theta),0,st.mascotR*Math.cos(st.theta));
      st.chair.visible=false;
      /* the presenter's screen glows in its accent colour */
      if(st.screen){ st.screen.material.emissiveIntensity+=((presenting?1.6:0.35)-st.screen.material.emissiveIntensity)*0.1; }
      /* the presenter leans back onto the table rim */
      st.leanAmt+=((presenting?-0.32:0)-st.leanAmt)*0.08;
      st.lean.rotation.x=st.leanAmt;
    });

    renderer.render(scene,cam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
