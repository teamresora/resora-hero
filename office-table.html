<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resora Office Table</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#050d1f;color:#f4f7fb;font-family:'IBM Plex Mono',ui-monospace,monospace}
.track{height:500vh;position:relative}
.sticky{position:sticky;top:0;height:100vh;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(3,8,20,.8) 100%)}
.dots{position:absolute;right:max(24px,4vw);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.dots span{width:8px;height:8px;border-radius:9999px;background:rgba(0,194,186,.25);transition:background .3s,transform .3s}
.dots span.on{background:#ff5a5f;transform:scale(1.4)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="data-teal.js"></script>
<script src="data-red.js"></script>
<script src="data-yellow.js"></script>
<script src="data-navy.js"></script>
<script src="data-white.js"></script>
</head>
<body>
<div class="track" id="track">
  <div class="sticky">
    <div id="stage"></div>
    <div class="vig"></div>
    <div class="dots" id="dots"></div>
  </div>
</div>
<script>
(function(){
  /* the five presenters, in the order they take the front seat */
  var SECTIONS=[
    {model:'MB_TEAL',  kick:'The problem',  head:'Your Filipino team member may be an employee.', body:'If they work set hours and follow your direction, courts may treat them as your employee.'},
    {model:'MB_RED',   kick:'How it works', head:'Resora employs them for you.', body:'We recruit, employ, pay and manage. You lead the work, and we carry the employer load.'},
    {model:'MB_YELLOW',kick:'The talent',   head:'Business-ready English. AEST hours.', body:'Strong AI-tool skills, 40+ years of Australian business experience behind the team.'},
    {model:'MB_NAVY',  kick:'Pricing',      head:'No salary markup. No setup fee.', body:'Recruitment from $4,750, then management from $200 a month per team member.'},
    {model:'MB_WHITE', kick:'Compliance',   head:'Fully compliant with Australian law.', body:'Fair Work protected. Payroll, super and leave handled for you, every pay run.'}
  ];
  var N=SECTIONS.length, R=2.4, H=1.4;
  var track=document.getElementById('track');
  var stage=document.getElementById('stage');
  var dotsEl=document.getElementById('dots');
  SECTIONS.forEach(function(){ var d=document.createElement('span'); dotsEl.appendChild(d); });
  var dots=[].slice.call(dotsEl.children);

  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true;
  renderer.setClearColor(0x000000,0);
  stage.appendChild(renderer.domElement);

  var scene=new THREE.Scene();
  var cam=new THREE.PerspectiveCamera(30,1,0.1,100);
  scene.add(new THREE.HemisphereLight(0x6f8fd0,0x03070f,0.35));
  var key=new THREE.SpotLight(0xffe1b0,2.2,25,Math.PI/4,0.8,1.4);
  key.position.set(-3,9,7); key.target.position.set(0,0.6,0); key.castShadow=true;
  scene.add(key); scene.add(key.target);
  var rim=new THREE.DirectionalLight(0x4fe6dd,1.6); rim.position.set(4,3,-4); scene.add(rim);

  function mat(c,extra){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:0.35,metalness:0.4},extra||{}));}
  var floor=new THREE.Mesh(new THREE.CircleGeometry(6,96),new THREE.ShadowMaterial({opacity:0.5}));
  floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
  var plate=new THREE.Mesh(new THREE.CircleGeometry(5.4,96),mat(0x03101f,{roughness:0.4,metalness:0.5,transparent:true,opacity:0.9}));
  plate.rotation.x=-Math.PI/2; plate.position.y=0.001; scene.add(plate);
  var ring=new THREE.Mesh(new THREE.RingGeometry(5.36,5.42,160),new THREE.MeshBasicMaterial({color:0x00c2ba,transparent:true,opacity:0.9}));
  ring.rotation.x=-Math.PI/2; ring.position.y=0.003; scene.add(ring);

  /* the rotating table: a round top on a single pedestal */
  var table=new THREE.Group(); scene.add(table);
  var top=new THREE.Mesh(new THREE.CylinderGeometry(R+0.2,R+0.2,0.12,96),mat(0x0b2236,{metalness:0.6,roughness:0.35}));
  top.position.y=0.55; top.castShadow=true; top.receiveShadow=true; table.add(top);
  var rimRing=new THREE.Mesh(new THREE.TorusGeometry(R+0.2,0.03,12,128),mat(0x00c2ba,{emissive:0x00c2ba,emissiveIntensity:0.5}));
  rimRing.rotation.x=Math.PI/2; rimRing.position.y=0.62; table.add(rimRing);
  var pedestal=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.5,0.55,48),mat(0xc9d6e6,{metalness:0.85,roughness:0.25}));
  pedestal.position.y=0.27; pedestal.castShadow=true; table.add(pedestal);

  /* hologram: the presenter's text, floating in front of the camera */
  var holoCanvas=document.createElement('canvas'); holoCanvas.width=1024; holoCanvas.height=576;
  var hctx=holoCanvas.getContext('2d');
  var holoTex=new THREE.CanvasTexture(holoCanvas);
  var holo=new THREE.Mesh(new THREE.PlaneGeometry(3.2,1.8),new THREE.MeshBasicMaterial({map:holoTex,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide}));
  holo.position.set(0,2.55,3.4); scene.add(holo);
  var holoShown=-1;
  function drawHolo(s){
    var ctx=hctx, W=holoCanvas.width, Hh=holoCanvas.height;
    ctx.clearRect(0,0,W,Hh);
    ctx.fillStyle='rgba(0,194,186,0.10)'; ctx.fillRect(0,0,W,Hh);
    ctx.strokeStyle='rgba(0,194,186,0.8)'; ctx.lineWidth=4; ctx.strokeRect(6,6,W-12,Hh-12);
    ctx.fillStyle='rgba(255,255,255,0.04)';
    for(var y=0;y<Hh;y+=4){ ctx.fillRect(0,y,W,1); }
    ctx.fillStyle='#00c2ba'; ctx.font='500 30px "IBM Plex Mono", monospace';
    ctx.fillText(s.kick.toUpperCase(),60,110);
    ctx.fillStyle='#f4f7fb'; ctx.font='800 64px "Unbounded", sans-serif';
    wrap(s.head,60,190,W-120,74);
    ctx.fillStyle='#9fb3d1'; ctx.font='400 32px "IBM Plex Mono", monospace';
    wrap(s.body,60,400,W-120,44);
    holoTex.needsUpdate=true;
  }
  function wrap(text,x,y,maxW,lh){
    var words=text.split(' '), line='';
    for(var i=0;i<words.length;i++){
      var test=line+words[i]+' ';
      if(hctx.measureText(test).width>maxW && line){ hctx.fillText(line,x,y); line=words[i]+' '; y+=lh; }
      else { line=test; }
    }
    hctx.fillText(line,x,y);
  }

  /* the five stations: a mascot stands behind a monitor on the rim, facing outward */
  var stations=[];
  var loadedFont=false;
  SECTIONS.forEach(function(s,i){
    var theta=i*Math.PI*2/N;
    var st={theta:theta,mascot:new THREE.Group(),desk:new THREE.Group(),monitor:new THREE.Group(),screenMat:null,flip:0};
    st.mascot.position.set(R*Math.sin(theta),0,R*Math.cos(theta));
    st.mascot.rotation.y=theta;
    table.add(st.mascot);

    /* desk and monitor sit between the mascot and the outside edge */
    var dpos=(R+0.6);
    st.desk.position.set(dpos*Math.sin(theta),0,dpos*Math.cos(theta));
    st.desk.rotation.y=theta;
    var deskTop=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.07,0.6),mat(0x0b2236,{metalness:0.5,roughness:0.4}));
    deskTop.position.y=0.9; deskTop.castShadow=true; deskTop.receiveShadow=true; st.desk.add(deskTop);
    table.add(st.desk);

    st.monitor.position.set(dpos*Math.sin(theta),0,dpos*Math.cos(theta));
    st.monitor.rotation.y=theta+Math.PI;
    var body=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.55,0.05),mat(0x111b2b,{metalness:0.4,roughness:0.5}));
    body.position.set(0,1.3,0); body.castShadow=true; st.monitor.add(body);
    st.screenMat=new THREE.MeshBasicMaterial({color:0x00c2ba,transparent:true,opacity:0.55});
    var screen=new THREE.Mesh(new THREE.PlaneGeometry(0.8,0.46),st.screenMat);
    screen.position.set(0,1.3,0.03); st.monitor.add(screen);
    var stand=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.36,0.05),mat(0x111b2b));
    stand.position.set(0,1.0,0); st.monitor.add(stand);
    table.add(st.monitor);

    /* the mascot model, normalised to the same height as the hero */
    var bin=null; try{bin=atob(window[s.model]);}catch(e){bin=null;}
    if(bin){
      var buf=new Uint8Array(bin.length);
      for(var k=0;k<bin.length;k++){buf[k]=bin.charCodeAt(k);}
      new THREE.GLTFLoader().parse(buf.buffer,'',function(gltf){
        var m=gltf.scene;
        m.rotation.y=-Math.PI/2;
        m.updateMatrixWorld(true);
        var box=new THREE.Box3().setFromObject(m);
        m.scale.setScalar(H/box.getSize(new THREE.Vector3()).y);
        m.updateMatrixWorld(true);
        box=new THREE.Box3().setFromObject(m);
        var cen=box.getCenter(new THREE.Vector3());
        m.position.set(-cen.x,-box.min.y,-cen.z);
        m.traverse(function(o){ if(o.isMesh){ o.castShadow=true; o.receiveShadow=true; } });
        st.mascot.add(m);
      },function(){});
    }
    stations.push(st);
  });

  /* layout */
  function layout(){
    var w=innerWidth,h=innerHeight;
    renderer.setSize(w,h,false);
    cam.aspect=w/h;
    if(w<700){ cam.fov=46; cam.position.set(0,3.6,11); cam.lookAt(0,1.4,0); }
    else { cam.fov=30; cam.position.set(0,2.8,11); cam.lookAt(0,1.3,0); }
    cam.updateProjectionMatrix();
  }
  layout();
  addEventListener('resize',layout);

  /* scroll drives which section is presenting */
  function progress(){
    var r=track.getBoundingClientRect();
    var total=track.offsetHeight-innerHeight;
    return Math.min(1,Math.max(0,-r.top/total));
  }

  var rot=0, current=0, active=-1;
  var holoOpacity=0;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function frame(now){
    var p=progress();
    var idx=Math.min(N-1,Math.floor(p*N));
    /* the table turns so the presenter's seat faces the camera */
    var target=-stations[idx].theta;
    /* take the shortest way round */
    var diff=target-rot;
    diff=Math.atan2(Math.sin(diff),Math.cos(diff));
    rot+=diff*0.06;
    table.rotation.y=rot;

    if(idx!==active){
      active=idx;
      drawHolo(SECTIONS[idx]);
      dots.forEach(function(d,i){ d.classList.toggle('on',i===idx); });
    }
    holoOpacity+=((1)-holoOpacity)*0.08;
    holo.material.opacity=holoOpacity*0.95;
    holo.position.y=2.55+(reduce?0:Math.sin((now||0)/1000*1.2)*0.04);

    stations.forEach(function(st,i){
      var presenting=(i===idx);
      /* the presenter's monitor turns to face the camera, the others face their mascots */
      var goal=presenting?st.theta:st.theta+Math.PI;
      var d=goal-st.monitor.rotation.y;
      d=Math.atan2(Math.sin(d),Math.cos(d));
      st.monitor.rotation.y+=d*0.08;
      st.screenMat.opacity+=((presenting?0.9:0.45)-st.screenMat.opacity)*0.08;
    });

    renderer.render(scene,cam);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
